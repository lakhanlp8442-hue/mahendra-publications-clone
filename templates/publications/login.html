{% extends 'publications/base.html' %}

{% block title %}Login | Mahendra Publications{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white text-center py-3">
                <h5 class="mb-0">Portal Login</h5>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Login to Dashboard</button>
                    </div>
                </form>
                <p class="text-center small mt-3 mb-0">
                    New Researcher? <a href="{% url 'register' %}">Create an Author / Reviewer Account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
